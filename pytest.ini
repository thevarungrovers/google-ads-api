[pytest]
# googleads_reporting is listed so --doctest-modules picks up the worked
# examples in the module docstrings (customer_id, fields, query).
testpaths = tests googleads_reporting
addopts = -ra --doctest-modules
# The repo root on sys.path, so `.venv/bin/pytest` works as well as
# `python -m pytest` (which adds the cwd itself). Without it the bare entry
# point dies in conftest with "No module named 'googleads_reporting'".
pythonpath = .
